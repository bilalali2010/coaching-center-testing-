<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coaching Center Chatbot</title>

<style>
/* ===================== CHAT BUTTON ===================== */
#chat-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #0f172a;
    color: #ffffff;
    border: none;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    z-index: 9998;
}

/* ===================== CHAT POPUP ===================== */
#chat-overlay {
    display: none;
    position: fixed;

    /* Desktop position */
    bottom: 24px;
    right: 24px;

    /* Desktop size (matches screenshot) */
    width: 380px;
    height: 72vh;
    max-height: 720px;

    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    z-index: 9999;
}

/* ===================== HEADER ===================== */
.chat-header {
    height: 64px;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 16px;
    font-family: Arial, sans-serif;
}

.chat-header strong {
    font-size: 14px;
    font-weight: 600;
}

.chat-header span {
    font-size: 11px;
    opacity: 0.85;
}

/* Close button */
.chat-close {
    position: absolute;
    right: 14px;
    top: 14px;
    background: none;
    border: none;
    color: #ffffff;
    font-size: 20px;
    cursor: pointer;
}

/* ===================== IFRAME ===================== */
#chat-frame {
    width: 100%;
    height: calc(100% - 64px);
    border: none;
}

/* ===================== MOBILE ===================== */
@media (max-width: 768px) {
    #chat-overlay {
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
    }

    #chat-toggle {
        bottom: 16px;
        right: 16px;
    }
}
</style>
</head>

<body>

<!-- CHAT BUTTON -->
<button id="chat-toggle">💬</button>

<!-- CHAT POPUP -->
<div id="chat-overlay">

    <div class="chat-header">
        <strong>Bilal Coaching Center</strong>
        <span>Online & Offline Learning Support</span>
        <button class="chat-close" onclick="toggleChat()">✕</button>
    </div>

    <!-- YOUR CHATBOT -->
    <iframe
        id="chat-frame"
        src="https://bilalali2010.github.io/coaching-center-testing-/chat"
        allow="clipboard-read; clipboard-write"
    ></iframe>

</div>

<script>
function toggleChat() {
    const chat = document.getElementById("chat-overlay");
    chat.style.display = chat.style.display === "block" ? "none" : "block";
}

document.getElementById("chat-toggle").addEventListener("click", toggleChat);
</script>

</body>
</html>
