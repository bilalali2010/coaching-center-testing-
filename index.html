<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Coaching Institute</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
body { margin:0; font-family:'Poppins', sans-serif; background:#f4f7fb; color:#333; }
.hero { background: linear-gradient(rgba(0,191,255,0.85), rgba(0,191,255,0.85)), url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat; padding:110px 20px; text-align:center; color:#fff; }
.hero h1 { font-size:46px; }
.hero p { max-width:850px; margin:auto; font-size:18px; }
footer { background:#00bfff; text-align:center; padding:25px; color:#fff; margin-top:60px; }

#chatbot-container { position:fixed; bottom:20px; right:20px; z-index:9999; }
#chatbot-bubble { width:60px; height:60px; background:#00bfff; color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,0.25); transition: transform 0.3s; }
#chatbot-bubble:hover { transform:scale(1.1); }

#chat-overlay { position:fixed; bottom:90px; right:20px; width:350px; height:450px; background:#fff; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,0.3); display:none; flex-direction:column; overflow:hidden; z-index:9998; }
#chat-header { background:#00bfff; color:#fff; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; }
#chat-messages { flex:1; padding:10px; overflow-y:auto; display:flex; flex-direction:column; }
.message { margin-bottom:10px; padding:8px 12px; border-radius:12px; max-width:80%; word-wrap:break-word; }
.user-message { background:#00bfff; color:#fff; align-self:flex-end; }
.bot-message { background:#f1f1f1; color:#333; align-self:flex-start; }
#chat-input-container { display:flex; border-top:1px solid #ccc; }
#chat-input { flex:1; border:none; padding:10px; font-size:14px; }
#chat-send { background:#00bfff; color:#fff; border:none; padding:0 15px; cursor:pointer; }

@media (max-width:768px) {
  #chat-overlay { width:90%; right:5%; bottom:80px; }
  #chatbot-bubble { width:50px; height:50px; font-size:22px; }
}
</style>
</head>
<body>

<div class="hero">
  <h1>NextGen Coaching Institute</h1>
  <p>Empowering students with strong academics, competitive exam preparation, career-focused skills, and AI-powered learning support.</p>
</div>

<footer>© 2025 NextGen Coaching Institute | Building Futures Through Education</footer>

<!-- Chatbot Overlay -->
<div id="chatbot-container">
  <div id="chatbot-bubble">💬</div>
</div>

<div id="chat-overlay">
  <div id="chat-header">
    NextGen AI Assistant
    <span id="chat-close" style="cursor:pointer;">✖</span>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-container">
    <input type="text" id="chat-input" placeholder="Type your message...">
    <button id="chat-send">Send</button>
  </div>
</div>

<script>
const bubble = document.getElementById('chatbot-bubble');
const overlay = document.getElementById('chat-overlay');
const closeBtn = document.getElementById('chat-close');
const messages = document.getElementById('chat-messages');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('chat-send');

bubble.onclick = () => overlay.style.display = "flex";
closeBtn.onclick = () => overlay.style.display = "none";

function addMessage(text, sender){
  const msg = document.createElement('div');
  msg.classList.add('message', sender==='user'?'user-message':'bot-message');
  msg.innerText = text;
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;
  addMessage(text,'user');
  input.value='';

  try{
    const res = await fetch('http://chat-with-nextgen-coaching.streamlit.app/', {  // <- your backend URL
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text })
    });
    const data = await res.json();
    addMessage(data.reply,'bot');
  } catch(err){
    console.error(err);
    addMessage("Sorry, something went wrong!",'bot');
  }
}

sendBtn.onclick = sendMessage;
input.addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });
</script>
</body>
</html>
