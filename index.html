<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Coaching Institute</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #f4f7fb;
  color: #333;
}

/* ================= EXISTING STYLES ================= */

.hero {
  background: linear-gradient(rgba(0,191,255,0.85), rgba(0,191,255,0.85)),
  url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat;
  padding: 100px 20px;
  text-align: center;
  color: #fff;
}

.hero h1 { font-size: 44px; }
.hero p { max-width: 800px; margin: auto; font-size: 18px; }

section {
  padding: 70px 20px;
  max-width: 1100px;
  margin: auto;
}

h2 {
  text-align: center;
  color: #00bfff;
  margin-bottom: 40px;
}

.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
}

.card {
  background: #fff;
  border-radius: 22px;
  padding: 30px;
  width: 300px;
  text-align: center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.card:hover { transform: translateY(-8px); }
.card i { font-size: 42px; color: #00bfff; margin-bottom: 15px; }
.card h3 { color: #00bfff; }

.cta {
  background: #ffffff;
  border-radius: 30px;
  padding: 60px 20px;
  text-align: center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

footer {
  background: #00bfff;
  text-align: center;
  padding: 20px;
  color: #fff;
  margin-top: 60px;
}

/* ================= CHATBOT STYLES ================= */

/* WhatsApp-style bubble */
#chatbot-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
}

#chatbot-bubble {
  width: 62px;
  height: 62px;
  background: #25D366; /* WhatsApp green */
  color: white;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

#chat-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 9998;
}

/* Chat window */
#chat-window {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 420px;
  height: 85%;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

/* Close button */
#chat-close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 20px;
  cursor: pointer;
  color: #555;
  z-index: 10;
}

#chat-frame {
  width: 100%;
  height: 100%;
  border: none;
}

/* Mobile full screen */
@media (max-width: 768px) {
  #chat-window {
    width: 100%;
    height: 100%;
    bottom: 0;
    right: 0;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="hero">
  <h1>NextGen Coaching Institute</h1>
  <p>Click the WhatsApp-style chat icon to talk with our AI assistant.</p>
</div>

<section class="cta">
  <h2>Start Your Journey with Confidence</h2>
</section>

<footer>
  © 2025 NextGen Coaching Institute | Excellence in Education
</footer>

<!-- ====== FLOATING CHATBOT ====== -->
<div id="chatbot-container">
  <div id="chatbot-bubble">
    <i class="fa-brands fa-whatsapp"></i>
  </div>
</div>

<div id="chat-overlay">
  <div id="chat-window">
    <div id="chat-close">❌</div>
    <iframe
      id="chat-frame"
      src="https://chat-with-nextgen-coaching.streamlit.app/">
    </iframe>
  </div>
</div>

<script>
const bubble = document.getElementById('chatbot-bubble');
const overlay = document.getElementById('chat-overlay');
const closeBtn = document.getElementById('chat-close');

bubble.addEventListener('click', () => {
  overlay.style.display = "block";
});

closeBtn.addEventListener('click', () => {
  overlay.style.display = "none";
});
</script>

</body>
</html>
