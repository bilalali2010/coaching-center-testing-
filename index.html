<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Coaching Institute</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
/* ================= GLOBAL ================= */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    font-family: 'Poppins', sans-serif;
    background: #f4f7fb;
}

/* ================= HERO ================= */
.hero {
    background: linear-gradient(rgba(0,191,255,0.85), rgba(0,191,255,0.85)),
    url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat;
    padding: 90px 16px;
    text-align: center;
    color: #fff;
}

.hero h1 { font-size: 40px; }
.hero p { max-width: 800px; margin: auto; }

/* ================= FLOATING CHAT BUTTON ================= */
#chatbot-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
}

#chatbot-bubble {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #00bfff, #00ffd5);
    color: #002b36;
    font-size: 28px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,191,255,0.5);
}

/* ================= FULLSCREEN CHAT OVERLAY ================= */
#chat-overlay {
    display: none;
    position: fixed;
    inset: 0;                 /* ⬅️ FULL SCREEN (PC + MOBILE) */
    width: 100%;
    height: 100%;
    background: #ffffff;
    z-index: 10000;
}

/* ================= CHAT HEADER ================= */
.chat-header {
    height: 56px;
    background: linear-gradient(135deg, #00bfff, #009acd);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.chat-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: #00ff6a;
    border-radius: 50%;
}

.chat-header-right i {
    font-size: 18px;
    cursor: pointer;
}

/* ================= IFRAME ================= */
#chat-frame {
    width: 100%;
    height: calc(100% - 56px);
    border: none;
}
</style>
</head>

<body>

<div class="hero">
    <h1>NextGen Coaching Institute</h1>
    <p>Academic excellence, competitive success, and AI-powered student support.</p>
</div>

<!-- CHAT BUTTON -->
<div id="chatbot-container">
    <div id="chatbot-bubble">💬</div>
</div>

<!-- FULLSCREEN CHAT -->
<div id="chat-overlay">
    <div class="chat-header">
        <div class="chat-header-left">
            <strong>NextGen AI</strong>
            <span class="status-dot"></span>
        </div>
        <div class="chat-header-right">
            <i class="fa-solid fa-xmark" id="close-btn"></i>
        </div>
    </div>

    <iframe
        id="chat-frame"
        src="https://chat-with-nextgen-coaching.streamlit.app/?embed=true">
    </iframe>
</div>

<script>
const bubble = document.getElementById("chatbot-bubble");
const overlay = document.getElementById("chat-overlay");
const closeBtn = document.getElementById("close-btn");

bubble.onclick = () => {
    overlay.style.display = "block";
    document.body.style.overflow = "hidden"; // lock background
};

closeBtn.onclick = () => {
    overlay.style.display = "none";
    document.body.style.overflow = "auto";
};
</script>

</body>
</html>
